services:
  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/fair.db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - fair_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fair_data:
