services:
  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/fair.db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
    volumes:
      - fair_data:/data
    # Not published to the host: only nginx (web) can reach it.
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101
      - /tmp
    # Docker lets unprivileged processes bind low ports inside a container,
    # so nginx needs no capabilities at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  fair_data:
