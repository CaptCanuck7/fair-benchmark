[project]
name = "fair-workbench-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<2.12",
  "numpy>=2.1,<3",
  "sqlalchemy>=2.0,<2.1",
  "openpyxl>=3.1,<3.2",
  "defusedxml>=0.7,<0.8",
  "python-multipart>=0.0.20,<0.1",
  "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -m 'not live'"
markers = ["live: runs the pipeline through the real agent service and the Claude API (opt in with pytest -m live)"]
