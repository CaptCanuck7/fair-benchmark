server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Same limit as the API (MAX_BODY_BYTES); nginx rejects larger bodies first.
    client_max_body_size 1m;

    # Resolve "api" through Docker's DNS at request time rather than once at
    # startup, so recreating the api container (new IP) doesn't break the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $api_upstream;  # passes the original /api/... URI unchanged
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The single-page app: any other path serves index.html, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
